<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אלף-ביתא ישראל - למידת אמהרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&family=Noto+Sans+Ethiopic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5; --soft:#F7F7F7;
  --green:#3DB54A; --green-d:#2C8F38; --green-bg:#D9F5DC; --green-ink:#237A2E;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-bg:#FFDFE0; --red-ink:#D12626;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-bg:#DDF4FF; --blue-ink:#1578A8;
  --gold:#FFC800; --gold-d:#E0A400; --orange:#FF9600; --clay:#2A2220; --clay-d:#1A1412; --clay-l:#6A5750;
  --on:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131F24; --card:#1A2A31; --ink:#F1F7FB; --muted:#9FB0BA; --line:#37464F; --soft:#202F36;
    --green:#58C463; --green-d:#3C9A47; --green-bg:#1F3B26; --green-ink:#8BE294;
    --red:#FF6464; --red-d:#D94444; --red-bg:#40252A; --red-ink:#FF9A9A;
    --blue:#49C0F8; --blue-d:#2A9AD0; --blue-bg:#1B3644; --blue-ink:#8DD8FB;
    --on:#10202A; --clay:#5C4C45; --clay-d:#463933; --clay-l:#8C776D;
  }
}
:root[data-theme="dark"]{
  --bg:#131F24; --card:#1A2A31; --ink:#F1F7FB; --muted:#9FB0BA; --line:#37464F; --soft:#202F36;
  --green:#58C463; --green-d:#3C9A47; --green-bg:#1F3B26; --green-ink:#8BE294;
  --red:#FF6464; --red-d:#D94444; --red-bg:#40252A; --red-ink:#FF9A9A;
  --blue:#49C0F8; --blue-d:#2A9AD0; --blue-bg:#1B3644; --blue-ink:#8DD8FB;
  --on:#10202A; --clay:#5C4C45; --clay-d:#463933; --clay-l:#8C776D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif; font-size:1.0625rem; line-height:1.45; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit}
.eth{font-family:"Noto Sans Ethiopic","Kefa","Nyala","Abyssinica SIL",sans-serif; direction:ltr; unicode-bidi:isolate; font-weight:500}
.lat{direction:ltr; unicode-bidi:isolate}
h1,h2,h3,p{margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.wrap{max-width:34rem; margin:0 auto; padding:0 1rem 7rem}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; gap:1.1rem; padding:.7rem 0; border-bottom:2px solid var(--line); margin-bottom:1rem}
.stat{display:flex; align-items:center; gap:.3rem; font-weight:800; font-size:1.125rem}
.stat.fire b{color:var(--orange)} .stat.xp b{color:var(--gold-d)}
.stat small{font-weight:700; color:var(--muted); font-size:.8rem}
.grow{flex:1}
.icon-btn{background:none; border:0; font-size:1.35rem; line-height:1; padding:.4rem; cursor:pointer; border-radius:.6rem; color:var(--muted)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-weight:800; letter-spacing:.01em; min-height:3.1rem; padding:.6rem 1.3rem; border-radius:1rem; cursor:pointer;
  background:var(--card); color:var(--blue-ink); border:2px solid var(--line); border-bottom-width:4px; transition:transform .05s}
.btn:active{transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px}
.btn.primary{background:var(--green); border-color:var(--green-d); border-top-color:var(--green); border-inline-color:var(--green); color:var(--on)}
.btn.bad{background:var(--red); border-color:var(--red-d); border-top-color:var(--red); border-inline-color:var(--red); color:var(--on)}
.btn.blue{background:var(--blue); border-color:var(--blue-d); border-top-color:var(--blue); border-inline-color:var(--blue); color:var(--on)}
.btn.wide{width:100%}
.btn:disabled{background:var(--line); border-color:var(--line); color:var(--muted); cursor:default; transform:none}
.row{display:flex; gap:.6rem; flex-wrap:wrap}

/* bars */
.bar{height:1rem; background:var(--line); border-radius:1rem; overflow:hidden; position:relative}
.bar i{display:block; height:100%; background:var(--green); border-radius:1rem; transition:width .35s ease; position:relative; min-width:0}
.bar i::after{content:""; position:absolute; top:.2rem; left:.5rem; right:.5rem; height:.25rem; border-radius:1rem; background:rgba(255,255,255,.35)}
.bar.gold i{background:var(--gold)}

/* home */
.hello{display:flex; align-items:center; gap:.5rem; margin-bottom:1rem}
.bubble{position:relative; border:2px solid var(--line); border-radius:1rem; padding:.7rem 1rem; font-weight:500; flex:1}
.goal{border:2px solid var(--line); border-radius:1rem; padding:.8rem 1rem 1rem; margin-bottom:1.5rem}
.goal-t{display:flex; justify-content:space-between; font-weight:700; margin-bottom:.5rem}
.goal-t span:last-child{color:var(--muted); font-weight:500}

.unit{margin-bottom:2.5rem}
.unit-h{background:var(--c); color:var(--on); border-radius:1rem; padding:1rem 1.1rem; border-bottom:4px solid var(--cs)}
.unit-h small{font-weight:700; opacity:.85}
.unit-h h2{font-size:1.35rem; font-weight:800; line-height:1.25}
.unit-h p{font-size:.95rem; opacity:.9}
.chap{display:flex; align-items:center; gap:.8rem; width:100%; text-align:start; background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:1rem; padding:.75rem 1rem; margin-top:.7rem; cursor:pointer; scroll-margin-top:4.5rem}
.chap[aria-expanded="true"]{border-color:var(--c); background:var(--soft)}
.chap .ci{flex:1; min-width:0; display:flex; flex-direction:column; gap:.25rem}
.chap small{color:var(--muted); font-weight:700; font-size:.8rem}
.chap b{font-weight:800; font-size:1.05rem}
.chap .bar{height:.5rem; margin-top:.15rem} .chap .bar i{background:var(--c)} .chap .bar i::after{display:none}
.chap .chev{color:var(--muted); font-size:.8rem}
.chap + .path{margin-bottom:1.6rem}
.btn.go{flex-direction:column; gap:0; margin-bottom:1rem; line-height:1.3} .btn.go small{font-weight:500; font-size:.9rem; opacity:.95}
.path{list-style:none; margin:1.5rem 0 0; padding:0; display:flex; flex-direction:column; align-items:center; gap:1.1rem}
.path li{width:100%; display:flex; flex-direction:column; align-items:center}
.nodebox{display:flex; flex-direction:column; align-items:center; transform:translateX(var(--x,0px))}
.node{position:relative; width:5.5rem; height:5.5rem; border:0; background:none; padding:0; cursor:pointer}
.node .disc{position:absolute; inset:.6rem; bottom:.85rem; border-radius:50%; background:var(--c); box-shadow:0 .45rem 0 var(--cs); display:flex; align-items:center; justify-content:center; font-size:1.9rem; transition:transform .05s, box-shadow .05s}
.node:active .disc{transform:translateY(.3rem); box-shadow:0 .15rem 0 var(--cs)}
.node .disc .eth{color:var(--on); font-weight:700}
.node .ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.node .ring circle{fill:none; stroke-width:7}
.node .ring .tr{stroke:var(--line)} .node .ring .pr{stroke:var(--gold); stroke-linecap:round}
.node.gold .disc{background:var(--gold); box-shadow:0 .45rem 0 var(--gold-d)}
.nlabel{font-weight:700; font-size:.95rem; text-align:center; max-width:11rem; margin-top:.1rem}
.callout{width:100%; margin-top:.8rem; background:var(--c); color:var(--on); border-radius:1rem; padding:1rem; animation:pop .18s ease}
.callout h3{font-size:1.15rem; font-weight:800}
.callout p{opacity:.92; margin:.1rem 0 .8rem; font-size:.95rem}
.callout .btn{background:var(--card); color:var(--c); border-color:rgba(0,0,0,.18); border-top-color:var(--card); border-inline-color:var(--card)}
@keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}
.foot{color:var(--muted); font-size:.875rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; align-items:center}
.foot button{background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:.4rem 0}

/* bottom nav */
.nav{position:fixed; bottom:0; left:0; right:0; z-index:6; background:var(--bg); border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:34rem; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; padding:.45rem .8rem}
.nav button{background:none; border:2px solid transparent; border-radius:.9rem; padding:.35rem .2rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.05rem; font-weight:700; font-size:.8rem; color:var(--muted)}
.nav button span{font-size:1.5rem; line-height:1.2}
.nav button[aria-current="page"]{background:var(--blue-bg); border-color:var(--blue); color:var(--blue-ink)}

.review{display:flex; align-items:center; gap:.8rem; border:2px solid var(--blue); background:var(--blue-bg); color:var(--blue-ink); border-radius:1rem; padding:.8rem 1rem; margin-bottom:1.5rem}
.review div{flex:1; display:flex; flex-direction:column}
.review b{font-weight:800} .review span{font-size:.95rem}
.studio{padding-bottom:8rem}
.tr-snd{text-align:center; margin:.2rem 0 .8rem} .tr-snd .hs{font-size:2.2rem; font-weight:700} .tr-snd .lat{color:var(--muted); font-size:1.1rem}
.pad{position:relative; width:min(100%,20rem); aspect-ratio:1; margin:0 auto; border:2px solid var(--line); border-radius:1.2rem; background:var(--soft); overflow:hidden}
.pad canvas{position:absolute; inset:0; width:100%; height:100%}
.pad #trfg{touch-action:none; cursor:crosshair}
.tr-msg{text-align:center; font-weight:700; margin:.9rem 0; min-height:1.5rem; color:var(--muted)}
.tr-msg.good{color:var(--green-ink)} .tr-msg.bad{color:var(--red-ink)}
.tr-forms{display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center}
.tr-forms .tile.cur{background:var(--blue-bg); border-color:var(--blue); color:var(--blue-ink)}
.tipb{display:block; width:100%; margin-top:.6rem; background:none; border:2px solid rgba(255,255,255,.55); border-radius:1rem; color:inherit; font-weight:700; padding:.6rem; cursor:pointer}
.tip p{margin:0 0 .9rem}
.tip .ex{display:grid; grid-template-columns:auto 1fr; column-gap:.8rem; align-items:baseline; background:var(--soft); border-radius:.8rem; padding:.55rem .9rem; margin:0 0 .5rem}
.tip .ex .eth{font-size:1.45rem; font-weight:700; grid-row:1 / 3; align-self:center}
.tip .ex .lat{font-weight:700; text-align:start}
.tip .ex .exh{color:var(--muted); font-size:.95rem}
.ghead{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-top:2rem}
.ghead h2{font-size:1.25rem; font-weight:800} .ghead small{color:var(--muted)}
.gacts{display:flex; gap:.5rem; flex-wrap:wrap; margin:.5rem 0 0}
.aud{border:2px solid var(--line); border-bottom-width:3px; background:var(--card); border-radius:.8rem; padding:.4rem .8rem; font-weight:700; font-size:.92rem; cursor:pointer; color:var(--blue-ink)}
.aud.on{background:var(--blue-bg); border-color:var(--blue)}
.ghead + .gacts + .chart{margin-top:.7rem}
.rules{border:2px solid var(--line); border-radius:1rem; padding:.8rem 1rem; margin-bottom:.5rem}
.rules summary{font-weight:800; cursor:pointer}
.rules p{margin:.7rem 0 .4rem; color:var(--muted)} .rules .key{margin:0 0 .4rem; padding-inline-start:1.2rem} .rules .key li{margin-bottom:.35rem} .rules + .rules{margin-top:.5rem} .rules ol{margin:0 0 .8rem; padding-inline-start:1.4rem}
.tr-hint{display:flex; flex-direction:column; gap:.15rem; text-align:center; color:var(--muted); font-size:.95rem; margin:0 0 .8rem}
.tr-hint b{color:var(--ink); font-size:1.2rem}
.fb-ex{display:block; margin-top:.5rem; padding-top:.45rem; border-top:1px solid currentColor; font-size:.92rem; font-weight:400; line-height:1.45}
.fb-ex .eth{font-size:1.1rem; font-weight:700} .fb-ex .lat{color:inherit; opacity:.85}
/* letters tab */
.title{font-size:1.5rem; font-weight:800; margin-bottom:.3rem}
.sub{color:var(--muted); margin-bottom:1rem}
.chart{margin-top:1.5rem}
.crow{display:grid; grid-template-columns:2.4rem repeat(7,1fr); gap:.25rem; align-items:stretch; direction:ltr; margin-bottom:.3rem}
.crow.head div{font-weight:800; color:var(--muted); font-size:.8rem; text-align:center; padding:.3rem 0}
.cell{background:var(--card); cursor:pointer; font:inherit; color:inherit; border:2px solid var(--line); border-bottom-width:3px; border-radius:.6rem; text-align:center; padding:.25rem 0 .3rem; display:flex; flex-direction:column; align-items:center; min-width:0}
.cell .eth{font-size:1.35rem; line-height:1.3}
.cell .lat{font-size:.68rem; color:var(--muted); font-weight:500}
.cell .m{width:60%; height:.25rem; border-radius:1rem; background:var(--line); margin-top:.15rem; overflow:hidden}
.cell .m i{display:block; height:100%; background:var(--gold)}
.crow.off .cell{opacity:.38}
.tog{border:2px solid var(--line); border-bottom-width:3px; border-radius:.6rem; background:var(--card); cursor:pointer; font-weight:800; color:var(--muted); padding:0}
.tog[aria-pressed="true"]{background:var(--green); border-color:var(--green-d); color:var(--on)}
.note{background:var(--soft); border-radius:1rem; padding:.8rem 1rem; margin:1.2rem 0; font-size:.95rem; color:var(--muted)}

/* my words */
.field{display:block; margin-bottom:.7rem}
.field span{display:block; font-weight:700; margin-bottom:.25rem}
.field input{font:inherit; width:100%; padding:.75rem .9rem; border-radius:.9rem; border:2px solid var(--line); background:var(--soft); color:var(--ink)}
.words{list-style:none; margin:1.25rem 0 0; padding:0}
.words li{display:flex; align-items:center; gap:.75rem; padding:.65rem 0; border-bottom:2px solid var(--line)}
.words .pair{flex:1; min-width:0}
.words .am{font-weight:700; unicode-bidi:plaintext; overflow-wrap:anywhere}
.words .he{color:var(--muted); overflow-wrap:anywhere}
.words button{background:none; border:0; color:var(--red-ink); cursor:pointer; padding:.5rem; font-weight:700; font-size:.9rem}

/* lesson */
.lesson{max-width:34rem; margin:0 auto; padding:0 1rem 11rem}
.l-top{position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; display:flex; align-items:center; gap:.8rem; padding:.8rem 0}
.l-top .bar{flex:1}
.hearts{font-weight:800; color:var(--red); display:flex; align-items:center; gap:.25rem; white-space:nowrap}
.ask{font-size:1.4rem; font-weight:800; margin:.6rem 0 1.1rem}
.prompt{border:2px solid var(--line); border-radius:1rem; padding:1.1rem 1rem; text-align:center; margin-bottom:1.1rem}
.prompt .glyph{font-size:clamp(4.5rem,24vw,7rem); line-height:1.2; font-weight:500}
.prompt .glyph.seq{font-size:clamp(2.8rem,14vw,4.5rem); letter-spacing:.05em}
.prompt .big{font-size:clamp(1.6rem,7vw,2.2rem); font-weight:800; line-height:1.3; overflow-wrap:anywhere}
.prompt .big.lat{display:block}
.prompt .fid{font-size:1.5rem; color:var(--muted); line-height:1.5}
.prompt .snd{font-size:clamp(3rem,16vw,4.5rem); line-height:1.3; font-weight:700; display:block}
.prompt .sndl{color:var(--muted); font-size:1.2rem; font-weight:500}
.choices{display:grid; gap:.6rem}
.choices.two{grid-template-columns:1fr 1fr}
.choice{background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:1rem; min-height:3.6rem; padding:.6rem .9rem; cursor:pointer; font-weight:500; font-size:1.1rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.05rem; text-align:center; overflow-wrap:anywhere}
.choice:active{transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px}
.am{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.3; max-width:100%}
.am .eth{font-size:1.45em; font-weight:700; overflow-wrap:anywhere}
.am .lat{font-size:.85em; font-weight:500; color:var(--muted); overflow-wrap:anywhere}
.am .solo{font-weight:700; unicode-bidi:plaintext; overflow-wrap:anywhere}
.am.pm .eth{font-size:clamp(2rem,9vw,2.8rem)} .am.pm .lat{font-size:1.2rem} .am.pm .solo{font-size:clamp(1.6rem,7vw,2.2rem)}
.choice.sel .lat,.choice.right .lat,.choice.wrong .lat{color:inherit}
.choice .g{font-size:2.6rem; color:var(--ink); line-height:1.2}
.choice .hs{font-size:1.8rem; font-weight:700; line-height:1.3}
.choice .ls{color:var(--muted); font-size:.85rem}
.choice.sel{background:var(--blue-bg); border-color:var(--blue); color:var(--blue-ink)}
.choice.sel .g,.choice.sel .eth,.choice.sel .ls{color:var(--blue-ink)}
.choice.right{background:var(--green-bg); border-color:var(--green); color:var(--green-ink)}
.choice.right .g,.choice.right .eth,.choice.right .ls{color:var(--green-ink)}
.choice.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red-ink)}
.choice.wrong .g,.choice.wrong .eth,.choice.wrong .ls{color:var(--red-ink)}
.choice:disabled{cursor:default; transform:none}
.choice.gone{opacity:.35; background:var(--soft)}
.choice.flash{animation:shake .35s}
@keyframes shake{25%{transform:translateX(5px)} 50%{transform:translateX(-5px)} 75%{transform:translateX(3px)}}
.match{display:grid; grid-template-columns:1fr 1fr; gap:.7rem}
.match .col{display:grid; gap:.6rem; grid-auto-rows:1fr}
.match .choice{min-height:4rem}
.answer-line{min-height:4rem; border-bottom:2px solid var(--line); border-top:2px solid var(--line); display:flex; flex-wrap:wrap; gap:.45rem; padding:.6rem 0; margin-bottom:1.2rem; align-content:flex-start}
.bank{display:flex; flex-wrap:wrap; gap:.45rem; justify-content:center}
.tile{display:inline-flex; flex-direction:column; align-items:center; line-height:1.25; background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:.8rem; padding:.45rem .8rem; font-weight:700; cursor:pointer; font-size:1.05rem}
.tile .eth{font-size:1.3rem; font-weight:700} .tile .eth + .lat{font-size:.78rem; font-weight:500; color:var(--muted)}
.tile.used .lat{color:transparent}
.tile.used{color:transparent; background:var(--line); border-color:var(--line); cursor:default}
.l-foot{position:fixed; bottom:0; left:0; right:0; z-index:6; background:var(--bg); border-top:2px solid var(--line); padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.l-foot > div{max-width:34rem; margin:0 auto}
.l-foot.ok{background:var(--green-bg); border-top-color:var(--green-bg); animation:rise .2s ease}
.l-foot.no{background:var(--red-bg); border-top-color:var(--red-bg); animation:rise .2s ease}
@keyframes rise{from{transform:translateY(30%); opacity:.3} to{transform:none; opacity:1}}
.fb-t{font-weight:800; font-size:1.3rem; margin-bottom:.2rem}
.ok .fb-t{color:var(--green-ink)} .no .fb-t{color:var(--red-ink)}
.fb-a{margin-bottom:.8rem; font-weight:500; overflow-wrap:anywhere}
.ok .fb-a{color:var(--green-ink)} .no .fb-a{color:var(--red-ink)}
.fb-a .am{margin-inline-end:.2rem} .fb-a .am .lat{color:inherit}
.hint{color:var(--muted); text-align:center; font-weight:500}

/* end screens */
.end{max-width:34rem; margin:0 auto; padding:2.5rem 1rem 3rem; text-align:center; position:relative; overflow:hidden; min-height:80vh}
.end h2{font-size:1.9rem; font-weight:800; color:var(--gold-d); margin:.6rem 0 .2rem}
.end.sad h2{color:var(--red-ink)}
.end p{color:var(--muted); margin-bottom:1.5rem}
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin-bottom:2rem}
.scard{border:2px solid var(--c); border-radius:1rem; overflow:hidden; background:var(--c)}
.scard small{display:block; color:var(--on); font-weight:800; font-size:.75rem; padding:.3rem .2rem}
.scard b{display:block; background:var(--bg); color:var(--c); border-radius:.8rem; padding:.7rem .2rem; font-size:1.3rem; font-weight:800}
.mascot{flex:none}
.bounce{animation:bounce 1s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)} to{transform:translateY(-10px)}}
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.end .mascot{position:relative}
.confetti i{position:absolute; top:-1rem; width:.55rem; height:.9rem; border-radius:.15rem; animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(95vh) rotate(540deg); opacity:.2}}
@media (prefers-reduced-motion:reduce){ .confetti{display:none} .bounce,.callout,.l-foot.ok,.l-foot.no,.choice.flash{animation:none} .bar i{transition:none} }

/* ===== tibeb theme =====
   White cotton ground and dark ink; colour lives only in the woven bands (.weave), which double as progress:
   what you have learned is woven, the rest is still bare thread. */
:root{
  --bg:#FCFBF8; --card:#FFFFFF; --ink:#1E1A2B; --muted:#67637C; --line:#E2DFE9; --soft:#F3F1F6;
  --green:#14785A; --green-d:#0E5C45; --green-bg:#DDF1E9; --green-ink:#0E5C45;
  --red:#C62F3B; --red-d:#9F222D; --red-bg:#FBE1E3; --red-ink:#A3212C;
  --blue:#1F4FA8; --blue-d:#173D85; --blue-bg:#E2EAF8; --blue-ink:#1B4594;
  --gold:#F4B41A; --gold-d:#8A5F00; --orange:#B24A08; --on:#FFFFFF; --btn:#1E1A2B; --btn-on:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16131F; --card:#1F1B2B; --ink:#F4F1FA; --muted:#A9A4BD; --line:#3A354B; --soft:#262136;
    --green:#3FB48D; --green-d:#2C8F6E; --green-bg:#173B30; --green-ink:#8FE0C2;
    --red:#EE6B75; --red-d:#C94752; --red-bg:#43212A; --red-ink:#FFA6AD;
    --blue:#7FA6F0; --blue-d:#5C86D6; --blue-bg:#1E2C4D; --blue-ink:#B4CCFA;
    --gold:#F4B41A; --gold-d:#F4C95A; --orange:#F09A5B; --on:#FFFFFF; --btn:#F4F1FA; --btn-on:#16131F;
  }
}
:root[data-theme="dark"]{
  --bg:#16131F; --card:#1F1B2B; --ink:#F4F1FA; --muted:#A9A4BD; --line:#3A354B; --soft:#262136;
  --green:#3FB48D; --green-d:#2C8F6E; --green-bg:#173B30; --green-ink:#8FE0C2;
  --red:#EE6B75; --red-d:#C94752; --red-bg:#43212A; --red-ink:#FFA6AD;
  --blue:#7FA6F0; --blue-d:#5C86D6; --blue-bg:#1E2C4D; --blue-ink:#B4CCFA;
  --gold:#F4B41A; --gold-d:#F4C95A; --orange:#F09A5B; --on:#FFFFFF; --btn:#F4F1FA; --btn-on:#16131F;
}
body{font-family:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif; font-size:1.0625rem; line-height:1.5}
.title,.unit-h h2,.ask,.end h2,.chap b,.callout h3,.brand,.ghead h2,.fb-t{font-family:"Suez One","Assistant",serif; font-weight:400; letter-spacing:0}
.eth{font-family:"Noto Sans Ethiopic","Kefa","Nyala","Abyssinica SIL",sans-serif}

/* the woven band */
.weave{display:block; position:relative; width:100%; height:var(--h,14px); overflow:hidden; border-radius:2px; background:var(--soft)}
.weave svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.weave .w0{opacity:.2; filter:saturate(.35)}
.hem{margin:0 -1rem 1.1rem}
.hem .weave{border-radius:0}

/* top bar */
.top{border-bottom:0; margin-bottom:0; gap:1rem; padding:.75rem 0 .6rem}
.brand{font-size:1.35rem; line-height:1.15; display:flex; flex-direction:column} .brand small{font-family:"Assistant",sans-serif; font-size:.8rem; font-weight:600; color:var(--muted)}
.brand .eth{font-size:1.15rem; font-weight:700; color:var(--muted)}
.stat{font-weight:600; font-size:.95rem; color:var(--muted); gap:.3rem}
.stat b{font-weight:800; color:var(--ink)} .stat.fire b,.stat.xp b{color:var(--ink)}
.icon-btn{color:var(--ink); display:inline-flex; align-items:center}
.icon-btn svg{display:block}

/* buttons: flat, ink */
.btn{font-weight:700; min-height:3rem; border-radius:.7rem; background:transparent; color:var(--ink); border:2px solid var(--ink); border-bottom-width:2px}
.btn:active{transform:translateY(1px); border-bottom-width:2px; margin-bottom:0}
.btn.primary,.btn.blue{background:var(--btn); border-color:var(--btn); color:var(--btn-on)}
.btn.bad{background:var(--red); border-color:var(--red); color:var(--on)}
.btn:disabled{background:var(--soft); border-color:var(--line); color:var(--muted)}
.btn.go{margin:0 0 1rem} .btn.go small{font-weight:400; opacity:.85}

/* home */
.bubble{border:1.5px solid var(--line); border-radius:.7rem}
.goal{border:0; border-radius:0; padding:0; margin-bottom:1.25rem}
.goal-t{font-weight:700; margin-bottom:.4rem}
.review{border:0; background:var(--soft); color:var(--ink); border-radius:.7rem}
.review b{font-weight:700} .review span{color:var(--muted)}
.unit{margin-bottom:2.75rem}
.unit-h{background:none; color:var(--ink); border:0; border-radius:0; padding:0; margin-top:2rem}
.unit-h small{color:var(--muted); font-weight:700; opacity:1}
.unit-h h2{font-size:1.75rem; line-height:1.2}
.unit-h p{color:var(--muted); opacity:1; font-size:1rem}
.chap{border:1.5px solid var(--line); border-bottom-width:1.5px; border-radius:.7rem; padding:.8rem 1rem .95rem; background:var(--card); align-items:flex-start}
.chap[aria-expanded="true"]{border-color:var(--ink); background:var(--card)}
.chap .ci{gap:.15rem}
.chap small{font-weight:600; font-size:.85rem; display:flex; gap:.7rem} .chap small span{unicode-bidi:isolate} .chap small span:first-child{color:var(--ink); font-weight:700}
.chap b{font-size:1.2rem; line-height:1.3}
.chap .weave{margin-top:.55rem}
.chap .chev{font-size:.7rem; padding-top:.35rem}

/* path nodes: a diamond, the basic tibeb motif */
.node .ring{transform:none}
.node .ring rect{fill:none; stroke-width:5}
.node .ring .tr{stroke:var(--line)} .node .ring .pr{stroke:var(--gold); stroke-linecap:butt}
.node .disc{inset:1.3rem; bottom:1.3rem; border-radius:.45rem; background:var(--c); box-shadow:none; transform:rotate(45deg); font-size:1.45rem; color:#fff}
.node .disc > *{transform:rotate(-45deg); display:block; line-height:1}
.node .disc .eth{color:#fff; font-weight:700}
.node:active .disc{transform:rotate(45deg) scale(.93); box-shadow:none}
.node.gold .disc{background:var(--gold); box-shadow:none; color:#1E1A2B} .node.gold .disc .eth{color:#1E1A2B}
.nlabel{font-weight:700}
.callout{background:var(--card); color:var(--ink); border:1.5px solid var(--ink); border-radius:.7rem; animation:none}
.callout h3{font-size:1.25rem} .callout p{color:var(--muted); opacity:1}
.callout .btn{background:var(--btn); color:var(--btn-on); border-color:var(--btn)}
.tipb{border:0; background:none; color:var(--ink); text-decoration:underline; text-underline-offset:.2em; font-weight:600; padding:.7rem 0 .1rem; margin-top:.3rem}
.foot button{color:var(--muted)}

/* bottom nav: words, the current one marked by a small diamond */
.nav{border-top:1.5px solid var(--line)}
.nav div{padding:.55rem .8rem .5rem}
.nav button{border:0; border-radius:.5rem; font-size:.95rem; font-weight:700; padding:.5rem .2rem .35rem; gap:.3rem; color:var(--muted)}
.nav button::before{content:""; width:.5rem; height:.5rem; transform:rotate(45deg); background:var(--line)}
.nav button[aria-current="page"]{background:none; color:var(--ink)}
.nav button[aria-current="page"]::before{background:#D43C28}

/* letters tab */
.cell{border:1.5px solid var(--line); border-bottom-width:1.5px; border-radius:.45rem}
.tog{border:1.5px solid var(--line); border-bottom-width:1.5px; border-radius:.45rem}
.tog[aria-pressed="true"]{background:var(--btn); border-color:var(--btn); color:var(--btn-on)}
.aud{border:1.5px solid var(--ink); border-bottom-width:1.5px; border-radius:.6rem; color:var(--ink); background:transparent}
.aud.on{background:var(--btn); border-color:var(--btn); color:var(--btn-on)}
.rules{border:1.5px solid var(--line); border-radius:.7rem} .rules summary{font-weight:700}
.note{border-radius:.7rem}
.field input{border:1.5px solid var(--line); border-radius:.6rem; background:var(--card)}

/* lesson */
.lbar{flex:1}
.hearts{gap:.42rem; padding-inline:.2rem}
.hearts i{width:.62rem; height:.62rem; transform:rotate(45deg); background:var(--red); border-radius:1px; display:block}
.hearts i.off{background:var(--line)}
.ask{font-size:1.55rem; line-height:1.25}
.prompt{border:1.5px solid var(--line); border-radius:.7rem}
.prompt .big{font-weight:700}
.choice{border:1.5px solid var(--line); border-bottom-width:1.5px; border-radius:.7rem}
.choice:active{transform:none; border-bottom-width:1.5px; margin-bottom:0}
.choice.sel{background:var(--soft); border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.choice.sel .g,.choice.sel .eth,.choice.sel .ls{color:var(--ink)}
.tile{border:1.5px solid var(--line); border-bottom-width:1.5px; border-radius:.55rem}
.tile.used{background:var(--soft); border-color:var(--soft)}
.tr-forms .tile.cur{background:var(--soft); border-color:var(--ink); color:var(--ink)}
.answer-line{border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line)}
.l-foot{border-top:1.5px solid var(--line)}
.fb-t{font-size:1.35rem} .fb-t .eth{font-size:1.5rem; font-weight:700} .fb-t small{font-family:"Assistant",sans-serif; font-size:.95rem; font-weight:600; margin-inline-start:.4rem; opacity:.85}
.pad{border:1.5px solid var(--line); border-radius:.7rem}
.tip .ex{border-radius:.6rem}

/* teaching screens */
.lead{color:var(--muted); margin:0 0 1rem}
.meet{display:grid; gap:.6rem}
.meet .mrow{display:flex; flex-direction:column; gap:.05rem; border:1.5px solid var(--line); border-radius:.7rem; padding:.7rem 1rem; background:var(--card)}
.meet .mrow .eth{font-size:1.6rem; font-weight:700; line-height:1.4; align-self:flex-start}
.meet .mrow .lat{color:var(--muted); align-self:flex-start} .meet .mrow .he{font-weight:700; margin-top:.2rem}
.lforms{border-top:1.5px solid var(--line)}
.lforms .frow{display:grid; grid-template-columns:2.8rem 3.4rem 2.4rem 1fr; align-items:center; column-gap:.7rem; padding:.3rem .2rem; border-bottom:1.5px solid var(--line)}
.frow .eth{font-size:1.9rem; font-weight:700; line-height:1.3} .frow .hs{font-size:1.45rem; font-weight:700} .frow .lat{color:var(--muted)} .frow .rule{color:var(--muted); font-size:.9rem; line-height:1.3}
.lesson .gacts{margin-top:1rem}
/* end of lesson: the unit's band is woven across once */
.end h2{color:var(--ink); font-size:2rem; margin-top:1.2rem}
.end.sad h2{color:var(--red-ink)}
.end .weave{margin:1.5rem 0 0}
.end .weave .w1{animation:weft 1.1s ease-out both}
@keyframes weft{from{clip-path:inset(0 0 0 100%)} to{clip-path:inset(0 0 0 0)}}
.cards{gap:0; border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line); margin:1.5rem 0 2rem}
.scard{border:0; border-radius:0; background:none; padding:.8rem .2rem; border-inline-start:1.5px solid var(--line)}
.scard:first-child{border-inline-start:0}
.scard small{color:var(--muted); font-weight:600; font-size:.85rem; padding:0}
.scard b{background:none; color:var(--ink); border-radius:0; padding:.1rem 0 0; font-size:1.6rem; font-weight:400; font-family:"Suez One","Assistant",serif}
@media (prefers-reduced-motion:reduce){ .end .weave .w1{animation:none} }
</style>

 {id:"routine1", title:"קטעים: שגרת יום ודרך", cards:[
  ["Bämäjämäriya bät'äwat ïnäsalähu käza šnt bet ïhedalähu","በመጀመሪያ በጠዋት እነሳለሁ ከዛ ሽንት ቤት እሄዳለሁ","קודם אני קם/ה בבוקר ואז הולך/ת לשירותים",1],

function connect(){

    var db=r[0], user=r[1];
    if (!db || !user) { setSync(SYNC_LOCAL); return; }
    return user.id().then(function(id){
      if (!id) { setSync(SYNC_LOCAL); return; }
      var d = db.doc("data/users/"+id+"/state");

          Object.keys(touched).forEach(function(k){ remote.str[k]=state.str[k]; if(k in state.due) remote.due[k]=state.due[k]; });

var actx=null;
function tone(f,t0,d,type,vol){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.14,t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+0.03);
}
function sound(k){
  if (state.mute) return;
  try {
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    var t=actx.currentTime;
    if (k==="ok"){ tone(660,t,.13); tone(990,t+.11,.2); }
    else if (k==="no"){ tone(220,t,.2,"triangle",.2); tone(160,t+.15,.28,"triangle",.2); }
    else if (k==="win"){ [523,659,784,1047].forEach(function(f,i){ tone(f,t+i*.12,.24); }); }
    else if (k==="pair"){ tone(784,t,.1,"sine",.1); }
  } catch(e){}
}

function buildLetterSetLesson(u){

/* a lesson on the path: the current step of the topic, plus words met earlier in the path */
function buildPathLesson(deck){

  var A=T.slice(0,half), B=T.slice(half);

function distract(ans, P){
  var cand = P.filter(function(x){return x.key!==ans.key;});

  take(cand.filter(function(x){return x.o===ans.o && x.L!==ans.L;}));
  take(cand.filter(function(x){return x.L===ans.L;}));

function letterMC(target, P, canRead){
  var r=Math.random(), type=(canRead && r<0.2) ? "read" : (r<0.6 ? "toSound" : "toGlyph");
  if (type==="read"){
    var n=Math.random()<0.5?2:3, seq=[target];
    while(seq.length<n) seq.push(P[Math.floor(Math.random()*P.length)]);
    shuffle(seq);
    var label=function(s){ return {heb:s.map(function(x){return x.heb;}).join("\u05BE"), lat:s.map(function(x){return x.lat;}).join("-")}; };
    var correct=label(seq), opts=[correct], seen={}; seen[correct.lat]=1;
    for (var t=0;t<40 && opts.length<4;t++){
      var pos=Math.floor(Math.random()*seq.length), d=distract(seq[pos],P)[0];
      if(!d) continue;
      var alt=seq.slice(); alt[pos]=d; var lb=label(alt);
      if(!seen[lb.lat]){ seen[lb.lat]=1; opts.push(lb); }
    }
    shuffle(opts);
    var g=seq.map(function(x){return x.g;}).join("");
    return {t:"mc", g:target.g, answer:opts.indexOf(correct), ask:"איך קוראים את זה?",
      prompt:'<div class="glyph seq eth" lang="am">'+g+'</div>',
      opts:opts.map(function(o){ return '<span class="hs" style="font-size:1.4rem">'+o.heb+'</span><span class="ls lat">'+esc(o.lat)+'</span>'; }),
      answerHTML:'<span class="eth" lang="am">'+g+'</span> = '+correct.heb+' <span class="lat">('+esc(correct.lat)+')</span>'};
  }
  var o2=shuffle([target].concat(distract(target,P)));
  var ans='<span class="eth" lang="am">'+target.g+'</span> = '+target.heb+' <span class="lat">('+esc(target.lat)+')</span>';
  if (type==="toSound") return {t:"mc", g:target.g, cols:2, answer:o2.indexOf(target), ask:"איך קוראים את זה?",
    prompt:'<div class="glyph eth" lang="am">'+target.g+'</div>', opts:o2.map(sndHTML), answerHTML:ans};
  return {t:"mc", g:target.g, cols:2, answer:o2.indexOf(target), ask:"איזו אות נשמעת כך?",
    prompt:'<span class="snd">'+target.heb+'</span><span class="sndl lat">'+esc(target.lat)+'</span>',
    opts:o2.map(function(o){ return '<span class="g eth" lang="am">'+o.g+'</span>'; }), answerHTML:ans};
}
function letterMatch(items){
  return {t:"match", ask:"התאימו אות לצליל",
    left: shuffle(items.map(function(f,i){ return {id:i, html:'<span class="g eth" lang="am" style="font-size:2rem">'+f.g+'</span>'}; })),
    right: shuffle(items.map(function(f,i){ return {id:i, html:sndHTML(f)}; })),
    gs: items.map(function(f){return f.g;}), done:{}, errs:{}, selL:null, selR:null, flash:null};

function buildLetterLesson(only){
  var P=only||pool(); if (!P.length) return [];
  var keys={}; P.forEach(function(x){keys[x.key]=1;});
  var distinct=Object.keys(keys).length, dr=drawer(P), mcs=[], matches=[];
  var nMC=Math.min(8, P.length);
  for (var i=0;i<nMC;i++) mcs.push(letterMC(dr.draw(), P, distinct>=8));
  for (var m=0;m<2 && distinct>=4;m++){
    var set=[], sk={};
    var add=function(f){ if(set.length<4 && !sk[f.key]){ sk[f.key]=1; set.push(f); } };
    var guard=0; while (set.length<4 && dr.left() && guard++<40) add(dr.draw());
    if (set.length<4) shuffle(P.slice()).forEach(add);
    if (set.length===4) matches.push(letterMatch(set));
  }
  return interleave(mcs, matches);
}

var L=null, HEARTS=5;
var GOBEZ='<span class="eth" lang="am">ጎበዝ</span> <small class="lat">gobäz</small>';     // "gobez": the praise word the author grew up with
var PRAISE=["נכון",GOBEZ,"בדיוק כך","יפה","זהו","מדויק"];
function startLesson(kind,id){
  var steps, title;
  if (kind==="letters"){ steps=buildLetterLesson(); title="אותיות"; }
  else if (kind==="lset"){ var u=chapters()[+id]; if(!u || !u.forms.length) return; steps=buildLetterSetLesson(u); title="אותיות"; }
  else { var d=getDeck(kind,id); if(!d) return; steps = kind==="deck" ? buildPathLesson(d) : buildWordLesson(d); title=d.title; }
  if (!steps.length) return;
  touched={};
  var ui=5; if (kind==="lset") ui=+id; else if (kind==="deck") chapters().forEach(function(c){ if (c.decks.indexOf(d)>=0) ui=c.i; });
  L={kind:kind, id:id, title:title, look:unitLook(ui), steps:steps, i:0, hearts:HEARTS, right:0, wrong:0, combo:0, phase:"ask", sel:null, ok:null};
  render(); window.scrollTo(0,0);
}
function cur(){ return L.steps[L.i]; }
function bump(g,up){
  var t=dayNum(), lvl=strength(g);
  if (up>0){ if (isNew(g) || isDue(g)){ lvl=Math.min(5,lvl+1); state.due[g]=t+IV[lvl]; } }
  else { lvl=Math.max(0,lvl+up); state.due[g]=t; }

}
function selectOpt(i){ if(!L||L.phase!=="ask"||cur().t!=="mc") return; L.sel=i; render(); }
function tileTap(i){ var st=cur(); if(!L||L.phase!=="ask"||st.t!=="build"||st.picked.indexOf(i)>=0) return; st.picked.push(i); render(); }
function untile(pos){ var st=cur(); if(!L||L.phase!=="ask"||st.t!=="build") return; st.picked.splice(pos,1); render(); }
function check(){
  if (!L || L.phase!=="ask") return;
  var st=cur(), ok;
  if (st.t==="mc"){ if (L.sel===null) return; ok = L.sel===st.answer; }
  else if (st.t==="build"){ if (!st.picked.length) return; ok = st.picked.map(function(i){return st.tiles[i];}).join(st.sep===undefined?" ":st.sep)===st.solution; }
  else return;
  L.phase="fb"; L.ok=ok;
  if (ok){ L.right++; L.combo++; bump(st.g,1); sound("ok"); }
  else { L.wrong++; L.combo=0; L.hearts--; bump(st.g,-2); sound("no"); }
  save(); render();
}
function matchTap(side,id){
  var st=cur(); if(!L||L.phase!=="ask"||st.t!=="match"||st.done[id]) return;
  if (side==="l") st.selL = st.selL===id ? null : id; else st.selR = st.selR===id ? null : id;
  st.flash=null;
  if (st.selL!==null && st.selR!==null){
    if (st.selL===st.selR){
      st.done[st.selL]=1; sound("pair");
      if (Object.keys(st.done).length===st.left.length){
        var clean=!Object.keys(st.errs).length;
        st.gs.forEach(function(g,i){ bump(g, st.errs[i]?-1:1); });
        L.phase="fb"; L.ok=true; L.right++; L.combo = clean ? L.combo+1 : 0; sound("ok"); save();
      }
    } else {
      st.errs[st.selL]=1; st.errs[st.selR]=1; st.flash=[st.selL,st.selR]; L.wrong++; L.combo=0; sound("no");
    }

function learned(){
  if (!L || L.done || L.failed || cur().t!=="learn") return;
  stopAudio(); L.i++;
  if (L.i>=L.steps.length) return finish();
  L.phase="ask"; L.sel=null; L.ok=null; render(); window.scrollTo(0,0);
}
function cont(){
  if (!L || L.phase!=="fb") return;
  if (L.hearts<=0){ L.failed=true; render(); window.scrollTo(0,0); return; }
  L.i++;
  if (L.i>=L.steps.length) return finish();
  L.phase="ask"; L.sel=null; L.ok=null; render(); window.scrollTo(0,0);
}
function finish(){
  var gain=10+(L.wrong===0?5:0), t=today();
  if (state.dayKey!==t){ state.dayKey=t; state.dayXp=0; }
  state.xp+=gain; state.dayXp+=gain;
  if (state.lastDay!==t){ state.streak = state.lastDay===yesterday() ? state.streak+1 : 1; state.lastDay=t; }
  L.done=true; L.gain=gain; save(); sound("win"); render(); window.scrollTo(0,0);
}
function quit(){ L=null; render(); }

var trCtx=null, trN=0, trDrawn=false;
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888"; }
function drawGlyph(ctx, n, g, color, outline){

function initTracer(){
  var bg=document.getElementById("trbg"), fg=document.getElementById("trfg"); if(!bg||!fg) return;
  var size=bg.parentNode.clientWidth||300, dpr=Math.min(2, window.devicePixelRatio||1), n=Math.round(size*dpr);
  bg.width=bg.height=fg.width=fg.height=n; trN=n; trDrawn=false;

  paint();
  if (document.fonts && document.fonts.load) document.fonts.load('500 40px "Noto Sans Ethiopic"', TR.g).then(paint, function(){});
  var ctx=fg.getContext("2d"); trCtx=ctx;

  var down=false, last=null;

  ex("የኔ","yäne","שלי (yä + ïne)")+ex("ያንተ","yantä","שלךָ (yä + antä)")},
 family:{t:"של באה לפני", h:
  '<p>התחילית yä- היא "של", אבל הסדר הפוך מהעברית: קודם בעל הדבר ואחריו הדבר עצמו.</p>'+
  ex("የአጎት ልጅ","yä agot lïj","בן דוד (מילולית: של-דוד ילד)")+ex("የልጅ ልጅ","yä lïj lïj","נכד (מילולית: של-ילד ילד)")+
  '<p>"שלי" אפשר גם להדביק לסוף המילה עם ‎-e, כמו אמי ואבי בעברית:</p>'+
  ex("እናቴ","ïnate","אמא שלי")+ex("ወንድሞቼ","wändïmoče","האחים שלי")},
 verbs:{t:"שם הפועל", h:
  '<p>בעברית שם הפועל מתחיל ב-ל (ללכת, לראות). באמהרית הוא מתחיל ב-mä- או ב-ma-:</p>'+
  ex("መሄድ","mähed","ללכת")+ex("ማየት","mayät","לראות")+ex("መፈለግ","mäfäläg","לרצות")+
  '<p>כשרואים מילה שמתחילה ב-mä- או ב-ma-, סביר מאוד שזה פועל בצורת המקור.</p>'},
 verbsI:{t:"אני... ואני לא...", h:
  '<p>"אני" בהווה נבנה מתחילית ï- (או a-) ומהסיומת ‎-alähu. התחילית מזכירה את א של העתיד בעברית (אלך, ארצה):</p>'+
  ex("እሄዳለሁ","ïhedalähu","אני הולך/ת")+ex("እፈልጋለሁ","ïfälgalähu","אני רוצה")+
  '<p>לשלילה עוטפים את הפועל משני הצדדים: al- בהתחלה ו‎-m בסוף, והסיומת ‎-alähu נופלת:</p>'+
  ex("አልፈልግም","alfälgm","אני לא רוצה")+ex("አላውቅም","alawk\'m","אני לא יודע/ת")},
 pres1:{t:"תחילית, פועל, סיומת", h:
  '<p>אותה צורה משמשת באמהרית גם להווה וגם לעתיד. היא בנויה משלושה חלקים: תחילית של הגוף, הפועל, וסיומת של הגוף.</p>'+
  ex("እበላለሁ","ï-bäl-alähu","אני: ï + פועל + alähu")+ex("እንበላለን","ïn-bäl-alän","אנחנו: ïn + פועל + alän")+ex("ትበላለህ","t-bäl-aläh","אתה: t + פועל + aläh")+
  ex("ትበያለሽ","t-bäy-aläš","את: t + פועל + aläš")+ex("ትበላላችሁ","t-bäl-alaču","אתם: t + פועל + alaču")+ex("ይበላል","y-bäl-al","הוא: y + פועל + al")+
  ex("ትበላለች","t-bäl-aläč","היא: t + פועל + aläč")+ex("ይበላሉ","y-bäl-alu","הם: y + פועל + alu")+
  '<p><b>שימו לב לצורה של "את":</b> העיצור האחרון של הפועל מתרכך. L הופך ל-Y, D ל-J, Z ל-Ž, T ל-Č ו-T\' ל-Č\'.</p>'+
  ex("ትበላለህ → ትበያለሽ","tbälaläh → tbäyaläš","אתה אוכל, את אוכלת (L הופך ל-Y)")+ex("ትወዳለህ → ትወጃለሽ","twädaläh → twäjaläš","אתה אוהב, את אוהבת (D הופך ל-J)")+
  ex("ትገዛለህ → ትገዣለሽ","tgäzaläh → tgäžaläš","אתה קונה, את קונה (Z הופך ל-Ž)")+ex("ትጫወታለህ → ትጫወቻለሽ","tč\'awätaläh → tč\'awäčaläš","אתה משחק, את משחקת (T הופך ל-Č)")+
  '<p><b>הריכוך קיים רק בהווה ובעתיד.</b> בעבר הוא מתבטל, והעיצור חוזר לצורה הרגילה שלו:</p>'+
  ex("ትጫወቻለሽ → ተጫወትሽ","tč\'awäčaläš → täč\'awätš","את משחקת, את שיחקת (ה-T חוזר)")+ex("ትታጠቢያለሽ → ታጠብሽ","tat\'äbiyaläš → tat\'äbš","את מתרחצת, את התרחצת")},
 demo:{t:"זה וזאת, קרוב ורחוק", h:
  '<p>כמו בעברית, יש צורה לזכר וצורה לנקבה. הנקבה מקבלת ‎-či:</p>'+
  ex("ይሄ","yhe","זה")+ex("ይቺ","yči","זאת")+ex("ያ","ya","ההוא")+ex("ያቺ","yači","ההיא")+
  '<p>ברבים אין הבחנה בין זכר לנקבה. הצורות מתחילות ב-ïnä-, כמו ïnäsu (הם) ו-ïnantä (אתם):</p>'+
  ex("እነዚህ","ïnäzi","אלה")+ex("እነዚያ","ïnäziya","ההם")},
 daily:{t:"‎-n הוא ה\"את\" של אמהרית", h:
  '<p>בעברית מסמנים מושא ישיר במילה "את": אני מצחצחת <b>את</b> השיניים. באמהרית אותו תפקיד ממלאת הסיומת ‎-n, שנדבקת לסוף המילה:</p>'+
  ex("ጥርሴ","t\'rse","השיניים שלי")+ex("ጥርሴን","t\'rsen","את השיניים שלי")+ex("ጥርሴን እቦርሻለሁ","T\'rsen ïboršalähu","אני מצחצח/ת את השיניים")+
  '<p>שימו לב גם לסדר המילים: הפועל בא בסוף, והמושא לפניו.</p>'+
  ex("አማርኛ እማራለሁ","Amarňa ïmaralähu","אני לומד/ת אמהרית (מילולית: אמהרית אני לומד/ת)")},
 obj:{t:"המושא נכנס לתוך הפועל", h:
  '<p>בעברית ספרותית אפשר להדביק את המושא לפועל: אראה אותה = אֶרְאֶנָּה. באמהרית זו הדרך הרגילה, והכינוי נכנס לאמצע הפועל, לפני הסיומת.</p>'+
  '<p>השיטה בארבעה צעדים, למשל "אני נותן/ת לה":</p>'+
  ex("እሰጣለሁ","ïsät\'alähu","1. מטים את הפועל: אני נותן/ת")+ex("እሰጥ... አለሁ","ïsät\'...alähu","2. פותחים רווח לפני הסיומת")+
  ex("ናት","nat","3. לוקחים את \"להיות\" של הגוף: היא = nat")+ex("እሰጣታለሁ","ïsät\'-at-alähu","4. מורידים את ה-n ומכניסים: at")+
  '<p>כך מקבלים את כל הכינויים מתוך "להיות":</p>'+
  ex("ነው → -äw","näw → äw","אותו, לו: ïsät\'äwalähu")+ex("ናቸው → -ačäw","načäw → ačäw","אותם, להם: ïsät\'ačäwalähu")+
  ex("ነኝ → -äň","näň → äň","אותי, לי: tïsät\'äňaläč")+ex("ነን → -än","nän → än","אותנו, לנו: yayänal")+ex("ናችሁ → -aču","naču → aču","אתכם, לכם: ïnayačualän")},
 past1:{t:"עבר: רק סיומות, כמו בעברית", h:
  '<p>בעבר אין תחילית. כמו בעברית (אכל-תי, אכל-נו, אכל-ו), הגוף מסומן רק בסיומת, וחלק מהסיומות ממש דומות:</p>'+
  ex("በላሁ","bäla-hu","אכלתי")+ex("በላን","bäla-n","אכלנו: ‎-n כמו ‎-נו")+ex("በላህ","bäla-h","אכלתָ")+ex("በላሽ","bäla-š","אכלתְ")+
  ex("በላችሁ","bäl-aču","אכלתם")+ex("በላ","bäla","הוא אכל: בלי סיומת")+ex("በላች","bäla-č","היא אכלה")+ex("በሉ","bäl-u","הם אכלו: ‎-u כמו ‎-וּ")+
  '<p><b>כשהפועל נגמר בעיצור</b> הסיומות של "אני" ו"אתה" מתקשות: ‎-ku במקום ‎-hu, ו‎-k במקום ‎-h. בנוסף, "הוא" מקבל ‎-ä ו"היא" מקבלת ‎-äč:</p>'+
  ex("ሄድኩ","hed-ku","הלכתי (ולא hedhu)")+ex("ሄድክ","hed-k","הלכתָ (ולא hedh)")+ex("ሄደ","hed-ä","הוא הלך")+ex("ሄደች","hed-äč","היא הלכה")+
  '<p><b>בעבר אין ריכוך ב"את".</b> בהווה העיצור האחרון משתנה (twäjaläš, את אוהבת), אבל בעבר הוא נשאר כמו שהוא:</p>'+
  ex("ሄድሽ","hed-š","הלכת, לאישה (ה-D נשאר, ולא hejš)")+ex("ተጫወትሽ","täč\'awät-š","שיחקת, לאישה (ה-T נשאר)")},
 after:{t:"אחרי ש... ולפני ש...", h:
  '<p>"אחרי ש..." בנוי כמו כריך: kä- לפני הפועל בעבר, ו-bähuala אחריו.</p>'+
  ex("ከበላሁ በኋላ","kä-bälahu bähuala","אחרי שאני אוכל/ת (מילולית: מ-אכלתי אחרי)")+ex("ከበላች በኋላ","kä-bälač bähuala","אחרי שהיא אוכלת")+
  '<p>"לפני ש..." בנוי אחרת: kä-, שם הפועל עם סיומת שייכות של הגוף, ואז bäfit. הסיומות הן אותן סיומות של sme, smš, smua.</p>'+
  ex("ከመሄዴ በፊት","kä-mähed-e bäfit","לפני שאני הולך/ת: ‎-e שלי")+ex("ከመሄድሽ በፊት","kä-mähed-ïš bäfit","לפני שאת הולכת: ‎-š שלך")+ex("ከመሄዷ በፊት","kä-mähed-ua bäfit","לפני שהיא הולכת: ‎-ua שלה")+
  '<p>בעברית יש מבנה מקביל, בעיקר בלשון גבוהה: "לפני לכתי", "לפני לכתה".</p>'},
 whenif:{t:"כש... ואם...", h:
  '<p>"כש..." הוא s- שנדבק לפועל בהווה, בלי הסיומת הארוכה. התחילית של הגוף נשארת:</p>'+
  ex("ስመጣ","s-mät\'a","כשאני בא/ה")+ex("ስንመጣ","s-n-mät\'a","כשאנחנו באים: n של אנחנו")+ex("ስትመጣ","s-t-mät\'a","כשאתה בא, כשהיא באה: t")+ex("ሲመጣ","si-mät\'a","כשהוא בא")+
  '<p>"אם..." הוא kä- שנדבק לפועל בעבר, גם כשמדברים על העתיד:</p>'+
  ex("ከሄድኩ","kä-hedku","אם אלך (מילולית: אם הלכתי)")+ex("ከጨረሰ","kä-č\'äräsä","אם הוא יסיים")},
 was:{t:"näbär = היה", h:
  '<p>näbär הוא "היה". הוא מקבל את סיומות העבר הרגילות, וכמו כל פועל באמהרית הוא בא בסוף המשפט:</p>'+
  ex("ነበርኩ","näbär-ku","הייתי")+ex("ነበርሽ","näbär-š","היית (לאישה)")+ex("ነበረ","näbär-ä","הוא היה")+ex("ነበሩ","näbär-u","הם היו")+
  '<p>"היה לי" בנוי בדיוק כמו בעברית, היה + לי: näbär ועוד כינוי המושא, אותו כינוי של aläň.</p>'+
  ex("ነበረኝ","näbärä-ň","היה לי")+ex("ነበረው","näbärä-w","היה לו")+ex("ነበራት","näbära-t","היה לה")+
  '<p>לשלילה עוטפים ב-al- ו‎-m:</p>'+ex("አልነበርኩም","al-näbärku-m","לא הייתי")+ex("አልነበረኝም","al-näbäräň-m","לא היה לי")},
 neg:{t:"al- ... -m עוטף את הפועל", h:
  '<p>שלילה של פועל נבנית משני חלקים שעוטפים אותו: al- בהתחלה ו‎-m בסוף.</p>'+
  '<p><b>בעבר</b> פשוט עוטפים את הצורה הרגילה:</p>'+ex("በላሁ → አልበላሁም","bälahu → al-bälahu-m","אכלתי, לא אכלתי")+
  '<p><b>בהווה</b> הסיומת הארוכה נופלת, והתחילית של הגוף מתמזגת עם ה-al:</p>'+
  ex("እበላለሁ → አልበላም","ïbälalähu → al-bäla-m","אני: al-")+ex("እንበላለን → አንበላም","ïnbälalän → an-bäla-m","אנחנו: an-")+
  ex("ትበላለህ → አትበላም","tbälaläh → at-bäla-m","אתה: at-")+ex("ይበላል → አይበላም","ybälal → ay-bäla-m","הוא: ay-")+
  '<p>שימו לב: albälam פירושו גם "אני לא אוכל/ת" וגם "הוא לא אכל", ו-atbälam פירושו גם "אתה לא אוכל" וגם "היא לא אוכלת". ההקשר מכריע.</p>'},
 feel1:{t:"קר לי, חם לי, נמאס לי", h:
  '<p>בעברית אומרים "קר לי", "חם לי", "נמאס לי": ההרגשה קורית לי. באמהרית זה המבנה הרגיל לרוב ההרגשות, והכינוי נכנס לאמצע המילה:</p>'+
  ex("በርዶኛል","bärdo-ň-al","קר לי")+ex("ሞቆኛል","mok\'o-ň-al","חם לי")+ex("ደክሞኛል","däkmo-ň-al","אני עייף/ה (מילולית: התעייף לי)")+ex("ሰልችቶኛል","sälčto-ň-al","נמאס לי")+
  '<p>כדי לשנות גוף מחליפים רק את הכינוי שבאמצע: ‎-ň לי, ‎-n לנו, ‎-h לךָ, ‎-š לךְ, ‎-aču לכם, ‎-t לו, ‎-at לה, ‎-ačäw להם.</p>'+
  ex("ደስ ብሎኛል","däs blo-ň-al","אני שמח/ה")+ex("ደስ ብሎታል","däs blo-t-al","הוא שמח: ב\"הוא\" הכינוי הוא ‎-t")+ex("ደስ ብሏታል","däs blu-at-al","היא שמחה")},
 rel1:{t:"איפה זה שאתה גר?", h:
  '<p>באמהרית שואלים שאלות במבנה שמוכר מעברית מדוברת: "איפה <b>זה ש</b>אתה גר?". המילה näw היא "זה", והתחילית yäm- היא "ש".</p>'+
  ex("የት ነው የምትኖረው?","Yät näw yämtnoräw?","איפה אתה גר? (מילולית: איפה זה, שאתה גר?)")+ex("መቼ ነው የምትበላው?","Mäče näw yämtbälaw?","מתי אתה אוכל? (מתי זה, שאתה אוכל?)")+
  '<p><b>איך בונים "שאני אוכל"?</b> לוקחים את צורת ההווה, מורידים את הסיומת הארוכה, מוסיפים yäm- בהתחלה ו‎-w בסוף:</p>'+
  ex("እበላለሁ → የምበላው","ïbälalähu → yäm-bäla-w","אני אוכל/ת, שאני אוכל/ת")+ex("ትበላለህ → የምትበላው","tbälaläh → yäm-tbäla-w","אתה אוכל, שאתה אוכל")+
  ex("ትበያለሽ → የምትበዪው","tbäyaläš → yäm-tbäyi-w","את אוכלת, שאת אוכלת")+ex("ይበላል → የሚበላው","ybälal → yämi-bäla-w","הוא אוכל, שהוא אוכל")+
  '<p>ב"אתם" וב"הם" הסיומת היא ‎-ut במקום ‎-w:</p>'+
  ex("የምትበሉት","yämtbälut","שאתם אוכלים")+ex("የሚበሉት","yämibälut","שהם אוכלים")+
  '<p><b>בעבר</b> זה פשוט יותר: yä- בהתחלה, צורת העבר, וסיומת קצרה בסוף:</p>'+
  ex("አደግኩ → ያደግኩት","adägku → y-adägku-t","גדלתי, שגדלתי")+ex("እሷ አዲስ አበባ ነው ያደገችው","Ïsua Addis Abäba näw yadägäčw","היא גדלה באדיס אבבה (מילולית: היא, אדיס אבבה זה, שגדלה)")},
 conj:{t:"תחיליות כמו בעתיד בעברית", h:
  '<p>כאן הקרבה לעברית הכי ברורה. בעברית העתיד מסומן בתחיליות א, ת, י, נ (ארצה, תרצה, ירצה, נרצה). באמהרית התחיליות כמעט זהות:</p>'+

var CH_LIST=null, openCh=null;      // openCh: null = follow the learner, -1 = all closed, otherwise the unit's number
function chapters(){
  if (CH_LIST) return CH_LIST;
  var used={}, byId={}, list=[]; DECKS.forEach(function(d){ byId[d.id]=d; });
  [1,2].forEach(function(part){
    UNITS.forEach(function(c){
      if (c.part!==part) return;
      var ds=c.ids.map(function(id){ return byId[id]; }).filter(function(d){ return d && !used[d.id]; });
      if (!ds.length) return;
      ds.forEach(function(d){ used[d.id]=1; });
      var forms=[]; (c.letters||[]).forEach(function(id){ if (BY_ID[id]) forms=forms.concat(BY_ID[id].forms); });
      list.push({t:c.t, part:part, decks:ds, letters:c.letters||[], forms:forms});
    });
    var rest=DECKS.filter(function(d){ return !used[d.id] && (d.src==="site" ? 2 : 1)===part; });   // a topic added later and not filed yet
    if (rest.length){ rest.forEach(function(d){ used[d.id]=1; }); list.push({t:"נושאים חדשים", part:part, decks:rest, letters:[], forms:[]}); }
  });
  list.forEach(function(c,i){ c.i=i; c.items=[]; c.decks.forEach(function(d){ d.part=c.part; c.items=c.items.concat(d.items); }); });
  return (CH_LIST=list);
}
/* steps: a topic is cut into groups of at most STEP cards, in the order of the deck */
var STEP=8;
function stepsOf(d){
  if (d.steps) return d.steps;
  var n=d.items.length, k=Math.max(1,Math.ceil(n/STEP)), sz=Math.ceil(n/k), out=[];
  for (var i=0;i<n;i+=sz) out.push(d.items.slice(i,i+sz));
  if (out.length>1 && out[out.length-1].length<4){ var tail=out.pop(); out[out.length-1]=out[out.length-1].concat(tail); }
  return (d.steps=out);
}
function curStep(d){      // the first step with a card not yet answered right; -1 when the whole topic was learned
  var S=stepsOf(d);
  for (var i=0;i<S.length;i++) if (S[i].some(function(x){ return strength(x.g)<1; })) return i;
  return -1;
}
function earlierSeen(deck, stepIdx){     // cards already met before this point of the path
  var out=[], hit=false, seen={};
  chapters().forEach(function(c){ c.decks.forEach(function(d){
    if (hit) return;
    if (d===deck){ hit=true; stepsOf(d).slice(0,Math.max(0,stepIdx)).forEach(function(st){ out=out.concat(st); }); return; }
    out=out.concat(d.items);
  }); });
  return out.filter(function(x){ if (seen[x.g] || isNew(x.g)) return false; seen[x.g]=1; return true; });
}
function nextDeck(){
  var L2=chapters();
  for (var i=0;i<L2.length;i++) for (var j=0;j<L2[i].decks.length;j++){
    var d=L2[i].decks[j], m=mastery(d.items);
    if (m.seen<m.n) return {deck:d, ch:i};
  }
  return null;
}

  var S=stepsOf(d), k=curStep(d);

}

  {k:"g1", t:"רגל אחת", ids:["ቀ","ተ","ቸ","ኀ","ነ","ኘ","የ","ገ","ፐ"]},
  {k:"g0", t:"בלי רגליים", ids:["ሀ","ረ","መ","ሠ","ወ","ዐ","ፀ","ፈ"]}
];
var RULES=["צורת הבסיס, פשוט זוכרים אותה","קו קטן בצד ימין","הרגל הימנית פונה הצידה","הרגל השמאלית קצרה מהימנית","טבעת על הרגל הימנית","אין כלל, פשוט זוכרים אותה","הרגל הימנית קצרה מהשמאלית (חוץ מ-ሎ)"];
var EXWORD={"ለ":["ለስላሳ","läsïlasa","משקה קל"],"ሰ":["ሰላም","sälam","שלום"],"ሸ":["ሸሚዝ","šämiz","חולצה"],"በ":["በር","bär","דלת"],"አ":["አዲስ","addis","חדש"],
  "ከ":["ከበሮ","käbäro","תוף"],"ዘ":["ዘፋኝ","zäfaň","זמר/ת"],"ደ":["ደስታ","dästa","שמחה"],"ጀ":["ጀበና","jäbäna","ג'בנה"],"ጸ":["ጸጉር","s'ägur","שיער"]};
function groupOf(id){ for (var i=0;i<GROUPS.length;i++) if (GROUPS[i].ids.indexOf(id)>=0) return GROUPS[i]; return null; }

/* recordings: decoded with Web Audio so they play without any media element */
var playing=null;      // {key, src}
function stopAudio(){ if(playing){ try{ playing.src.onended=null; playing.src.stop(); }catch(e){} playing=null; } }
function playAudio(key){
  var was = playing && playing.key===key; stopAudio();
  if (was){ render(); return; }
  var b64=(window.FIDEL_AUDIO||{})[key]; if(!b64) return;
  if (/\.(mp3|m4a|ogg|wav)$/i.test(b64)){      // a file next to the page (the stand-alone site) instead of embedded data
    var el=new Audio(b64), me={key:key, src:{onended:null, stop:function(){ el.pause(); }}};
    var over=function(){ if(playing===me){ playing=null; if(!TR&&!TIP&&(!L||(!L.done&&!L.failed&&cur().t==="learn"))) render(); } };
    el.onended=over; el.onerror=over;
    playing=me; render();
    var pp=el.play(); if (pp && pp.catch) pp.catch(over);
    return;
  }
  try {
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    var bin=atob(b64), buf=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    var mine={key:key, src:null}; playing=mine; render();
    var done=function(ab){
      if (playing!==mine) return;
      var src=actx.createBufferSource(); src.buffer=ab; src.connect(actx.destination);
      src.onended=function(){ if(playing===mine){ playing=null; if(!TR&&!TIP&&(!L||(!L.done&&!L.failed&&cur().t==="learn"))) render(); } };
      mine.src=src; src.start();
    };
    var fail=function(){ if(playing===mine){ playing=null; render(); } };
    var pr=actx.decodeAudioData(buf.buffer, done, fail); if (pr && pr.catch) pr.catch(fail);
  } catch(e){ playing=null; }
}
function audBtn(key,label){
  if (!(window.FIDEL_AUDIO||{})[key]) return "";
  var on = playing && playing.key===key;
  return '<button class="aud'+(on?' on':'')+'" data-act="aud:'+key+'">'+(on?"עצירה":"\u25B6\uFE0E "+label)+'</button>';
}
function viewLetters(){
  var P=pool(), m=mastery(P);
  var h='<h1 class="title">אותיות</h1><p class="sub">'+state.letters.length+' אותיות בתרגול, '+m.ok+' מתוך '+m.n+' צורות כבר יושבות טוב'+(m.due?', '+m.due+' מחכות לחזרה':'')+'.</p>'+
    '<button class="btn primary wide" data-act="start:letters"'+(P.length?'':' disabled')+'>תרגול אותיות</button>'+
    '<div class="note">האותיות מחולקות לארבע קבוצות לפי הצורה שלהן. סמנו ✓ ליד כל אות שכבר למדתם, ורק היא תיכנס לתרגול. לחיצה על צורה פותחת תרגול כתיבה.</div>'+
    '<details class="rules"><summary>איך מזהים את שבע הצורות?</summary><p>כל אות מופיעה בשבע צורות, אחת לכל תנועה: ä, u, i, a, e, ï, o. באותיות עם שתי רגליים ועם שלוש רגליים השינוי עקבי:</p><ol>'+
    RULES.map(function(r){ return '<li>'+r+'</li>'; }).join("")+'</ol>'+audBtn("vow","האזנה לשבע התנועות")+'</details>'+
    '<details class="rules"><summary>איך קוראים את הכתיב הלטיני?</summary><p>המילים והמשפטים כתובים באותו סימון של לוח האותיות:</p><ul class="key"><li><b class="lat">ä</b> התנועה של הצורה הראשונה, כמו סגול: <span class="lat">lä</span> = לֶ. באותיות א, ע ו-<span class="eth" lang="am">ኀ</span> הצורה הראשונה היא <span class="lat">a</span></li><li><b class="lat">e</b> התנועה של הצורה החמישית, כמו צירה: <span class="lat">le</span> = לֵי</li><li><b class="lat">ï</b> התנועה של הצורה השישית, כמו שווא נע. כשהיא לא נשמעת, לא כותבים אותה</li><li><b class="lat">š</b> = ש, <b class="lat">č</b> = צ\', <b class="lat">ž</b> = ז\', <b class="lat">ň</b> = ני</li><li><b class="lat">k\' t\' č\' p\' s\'</b> עיצורים מודגשים. הגרש מסמן את ההדגשה</li></ul></details>';
  var rowHTML=function(Lt){
    var on=state.letters.indexOf(Lt.id)>=0;
    return '<div class="crow'+(on?'':' off')+'"><button class="tog" data-act="toggle:'+Lt.id+'" aria-pressed="'+on+'" aria-label="'+(on?"הסרת":"הוספת")+' האות '+Lt.id+'">'+(on?"✓":"+")+'</button>'+
      Lt.forms.map(function(f){
        return '<button class="cell" data-act="trace:'+f.g+'" aria-label="תרגול כתיבה של '+f.g+'"><span class="eth" lang="am">'+f.g+'</span><span class="lat">'+esc(f.lat)+'</span><span class="m"><i style="width:'+(strength(f.g)*20)+'%"></i></span></button>';
      }).join("")+'</div>';
  };
  GROUPS.forEach(function(G){
    var onN=G.ids.filter(function(id){ return state.letters.indexOf(id)>=0; }).length, all=onN===G.ids.length;
    h+='<div class="ghead"><h2>'+G.t+'</h2><small>'+onN+' מתוך '+G.ids.length+' בתרגול</small></div>'+
      '<div class="gacts">'+audBtn(G.k,"האזנה לצורה הראשונה")+'<button class="aud" data-act="grp:'+G.k+'">'+(all?"הסרת הקבוצה מהתרגול":"הוספת כל הקבוצה")+'</button></div>'+
      '<div class="chart"><div class="crow head"><div></div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div></div>'+
      G.ids.map(function(id){ return rowHTML(BY_ID[id]); }).join("")+'</div>';
  });
  return h+'<div class="note">הצורה השישית (ï) נהגית לפעמים כתנועה קצרה מאוד ולפעמים כעיצור בלבד, בדומה לשווא נע ושווא נח. באותיות א, ע ו-ኀ הצורה הראשונה נקראת a.</div>';
}
function viewWords(){
  var n=state.words.length;
  var h='<h1 class="title">המילים שלי</h1><p class="sub">הוסיפו מילים ומשפטים שתרצו לזכור, בכל כתב: פידל, אותיות עבריות או לטיניות.</p>'+
    '<label class="field"><span>באמהרית</span><input id="wa" autocomplete="off" dir="auto"></label>'+
    '<label class="field"><span>בעברית</span><input id="wh" autocomplete="off"></label>'+
    '<div class="row"><button class="btn blue" data-act="addword">הוספת מילה</button>'+
    '<button class="btn primary" data-act="start:own"'+(n>=4?'':' disabled')+'>תרגול</button></div>';
  if (n<4) h+='<p class="sub" style="margin-top:1rem">'+(n?'יש כאן '+n+' מילים. ':'')+'צריך לפחות 4 מילים כדי להתחיל תרגול.</p>';
  if (n) h+='<ul class="words">'+state.words.slice().reverse().map(function(w){
      return '<li><div class="pair"><div class="am">'+esc(w.a)+'</div><div class="he">'+esc(w.h)+'</div></div><button data-act="del:'+esc(w.id)+'">מחיקה</button></li>'; }).join("")+'</ul>';
  return h;
}
function addWord(){
  var a=document.getElementById("wa"), h=document.getElementById("wh");
  var av=a.value.trim(), hv=h.value.trim();
  if (!av){ a.focus(); return; }
  if (!hv){ h.focus(); return; }
  state.words.push({id:uid(), a:av.slice(0,200), h:hv.slice(0,200)});
  save(); render();
  var na=document.getElementById("wa"); if(na) na.focus();
}

function tileHTML(st,w){
  if (st.spell){   // the sound is shown only under letters that are not in the learner's set yet
    var f=formOf(w), known=state.letters.indexOf(f.L.id)>=0;
    return '<span class="eth" lang="am" style="font-size:1.6rem">'+esc(w)+'</span>'+(known?'':'<span class="lat">'+esc(f.lat)+'</span>');
  }
  return st.fidel ? '<span class="eth" lang="am">'+esc(w)+'</span><span class="lat">'+esc(WORD_LAT[w]||tr(w))+'</span>' : '<span class="lat">'+esc(w)+'</span>';
}
function viewLesson(){
  if (L.done){
    var acc=Math.round(100*L.right/Math.max(1,L.right+L.wrong));
    return '<div class="end">'+mascot("happy",120)+'<h2>השיעור הושלם</h2><p>'+(L.wrong===0?"בלי אף טעות. בונוס של 5 XP.":esc(L.title))+'</p>'+weave(L.look.mo,100,40)+
      '<div class="cards"><div class="scard"><small>נקודות</small><b>'+L.gain+'</b></div>'+
      '<div class="scard"><small>דיוק</small><b>'+acc+'%</b></div>'+
      '<div class="scard"><small>רצף ימים</small><b>'+liveStreak()+'</b></div></div>'+
      '<button class="btn primary wide" data-act="quit">המשך</button></div>';
  }
  if (L.failed){
    return '<div class="end sad">'+mascot("sad",120)+'<h2>נגמרו הלבבות</h2><p>לא נורא, ככה לומדים. המילים שהיו בהן טעויות יחזרו ראשונות בפעם הבאה.</p>'+
      '<div class="row" style="justify-content:center"><button class="btn primary" data-act="retry">ניסיון נוסף</button><button class="btn" data-act="quit">חזרה</button></div></div>';
  }
  var st=cur(), fb=L.phase==="fb", pct=Math.round(100*(L.i+(fb?1:0))/L.steps.length);
  var h='<div class="lesson"><div class="l-top"><button class="icon-btn" data-act="quit" aria-label="יציאה מהשיעור">✕</button>'+
    '<div class="lbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'">'+weave(L.look.mo,pct,14)+'</div>'+
    '<div class="hearts" role="img" aria-label="נשארו '+L.hearts+' מתוך '+HEARTS+' לבבות">'+[0,1,2,3,4].map(function(i){ return '<i'+(i<L.hearts?'':' class="off"')+'></i>'; }).join("")+'</div></div><h2 class="ask">'+st.ask+'</h2>';
  var ready=false;
  if (st.t==="learn"){
    return h+st.html+(st.aud?'<div class="gacts">'+audBtn(st.aud,"האזנה לצורה הראשונה של אותיות הקבוצה")+'</div>':'')+
      '</div><div class="l-foot"><div><button class="btn primary wide" data-act="learned">הבנתי, לתרגול</button></div></div>';
  }
  if (st.t==="mc"){
    h+='<div class="prompt">'+st.prompt+'</div><div class="choices'+(st.cols===2?' two':'')+'">'+st.opts.map(function(o,i){
      var cls="choice";
      if (fb) cls += i===st.answer ? " right" : (i===L.sel ? " wrong" : " gone"); else if (i===L.sel) cls+=" sel";
      return '<button class="'+cls+'" data-act="opt:'+i+'"'+(fb?' disabled':'')+'>'+o+'</button>'; }).join("")+'</div>';
    ready = L.sel!==null;
  } else if (st.t==="build"){
    h+='<div class="prompt">'+st.prompt+'</div><div class="answer-line" dir="ltr">'+st.picked.map(function(ti,pos){
        return '<button class="tile" data-act="untile:'+pos+'"'+(fb?' disabled':'')+'>'+tileHTML(st,st.tiles[ti])+'</button>'; }).join("")+'</div>'+
      '<div class="bank" dir="ltr">'+st.tiles.map(function(w,i){
        var used=st.picked.indexOf(i)>=0;
        return '<button class="tile'+(used?' used':'')+'" data-act="tile:'+i+'"'+(used||fb?' disabled':'')+'>'+tileHTML(st,w)+'</button>'; }).join("")+'</div>';
    ready = st.picked.length>0;
  } else {
    var col=function(arr,side,sel){ return '<div class="col">'+arr.map(function(x){
      var cls="choice";
      if (st.done[x.id]) cls+=" right gone"; else if (sel===x.id) cls+=" sel"; else if (st.flash && st.flash.indexOf(x.id)>=0 && ((side==="l"&&st.flash[0]===x.id)||(side==="r"&&st.flash[1]===x.id))) cls+=" wrong flash";
      return '<button class="'+cls+'" data-act="m'+side+':'+x.id+'"'+(st.done[x.id]||fb?' disabled':'')+'>'+x.html+'</button>'; }).join("")+'</div>'; };
    h+='<div class="match">'+col(st.left,"l",st.selL)+col(st.right,"r",st.selR)+'</div>';
  }
  h+='</div>';
  if (!fb){
    h+='<div class="l-foot"><div>'+(st.t==="match" ? '<p class="hint">בוחרים פריט מכל עמודה</p>' : '<button class="btn primary wide" data-act="check"'+(ready?'':' disabled')+'>בדיקה</button>')+'</div></div>';
  } else if (L.ok){
    var title = (L.combo===3||L.combo===5||L.combo===8) ? GOBEZ+'<small>'+L.combo+' ברצף</small>' : PRAISE[L.i%PRAISE.length];
    h+='<div class="l-foot ok"><div><div class="fb-t">'+title+'</div>'+(st.answerHTML?'<div class="fb-a">'+st.answerHTML+'</div>':'<div class="fb-a"></div>')+'<button class="btn primary wide" data-act="cont">המשך</button></div></div>';
  } else {
    h+='<div class="l-foot no"><div><div class="fb-t">התשובה הנכונה:</div><div class="fb-a">'+st.answerHTML+'</div><button class="btn bad wide" data-act="cont">המשך</button></div></div>';
  }
  return h;
}
function render(){
  if (TR){ app.innerHTML=viewTracer(); initTracer(); return; }
  if (TIP && !L){ app.innerHTML=viewTip(); return; }
  if (L){ app.innerHTML=viewLesson(); return; }
  app.innerHTML='<div class="wrap">'+topbar()+(tab==="home"?viewHome():tab==="letters"?viewLetters():viewWords())+'</div>'+nav();
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  var p=b.getAttribute("data-act").split(":"), a=p[0], v=p.slice(1).join(":");
  if (a!=="reset" && resetArmed) resetArmed=false;
  switch(a){
    case "tab": stopAudio(); tab=v; openNode=null; render(); window.scrollTo(0,0); break;
    case "node": openNode = openNode===v ? null : v; render(); break;
    case "chap":
      openCh = shownCh()===+v ? -1 : +v; openNode=null; render();
      var chEl=document.getElementById("ch-"+v); if (chEl && chEl.scrollIntoView) chEl.scrollIntoView({block:"start"});
      break;
    case "start": stopAudio(); TIP=null; startLesson(p[1], p[2]); break;
    case "tip": if(TIPS[v]){ TIP=v; render(); window.scrollTo(0,0); } break;
    case "tipclose": TIP=null; render(); break;
    case "opt": selectOpt(+v); break;
    case "tile": tileTap(+v); break;
    case "untile": untile(+v); break;
    case "ml": matchTap("l",+v); break;
    case "mr": matchTap("r",+v); break;
    case "check": check(); break;
    case "learned": learned(); break;
    case "cont": cont(); break;
    case "quit": stopAudio(); quit(); break;
    case "retry": startLesson(L.kind, L.id); break;
    case "trace": stopAudio(); openTracer(v); break;
    case "aud": playAudio(v); break;
    case "grp":
      var G=null; GROUPS.forEach(function(x){ if(x.k===v) G=x; });
      if (G){
        var allOn=G.ids.every(function(id){ return state.letters.indexOf(id)>=0; });
        G.ids.forEach(function(id){ var k2=state.letters.indexOf(id); if(allOn){ if(k2>=0) state.letters.splice(k2,1); } else if(k2<0) state.letters.push(id); });
        save(); render();
      }
      break;
    case "trclose": TR=null; render(); break;
    case "trclear": trClear(); break;
    case "trcheck": trCheck(); break;
    case "mute": state.mute=!state.mute; save(); render(); if(!state.mute) sound("pair"); break;
    case "toggle": var k=state.letters.indexOf(v); if(k>=0) state.letters.splice(k,1); else state.letters.push(v); save(); render(); break;
    case "addword": addWord(); break;
    case "del": state.words=state.words.filter(function(w){return w.id!==v;}); save(); render(); break;
    case "reset":
      if (!resetArmed){ resetArmed=true; render(); break; }
      resetArmed=false; state.str={}; state.due={}; state.xp=0; state.streak=0; state.lastDay=""; state.dayKey=""; state.dayXp=0; save(); render(); break;
  }
});
app.addEventListener("keydown", function(e){
  if (e.key==="Enter" && (e.target.id==="wa" || e.target.id==="wh")){ e.preventDefault(); addWord(); }
});
document.addEventListener("keydown", function(e){
  if (!L || L.done || L.failed) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key==="Enter"){ e.preventDefault(); if (cur().t==="learn") learned(); else if (L.phase==="fb") cont(); else check(); return; }
  if (L.phase==="ask" && cur().t==="mc" && /^[1-4]$/.test(e.key)){ var n=+e.key-1; if(n<cur().opts.length) selectOpt(n); }
});

render();
connect();
})();
