# On every push to main: run the tests, and if they pass, publish the site/ folder to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A version number on every script and stylesheet address, so browsers load the new files right after a merge.
      - name: Stamp file versions
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((js|data|css)/[^\"?]+\.(js|css))\"#\1=\"\2?v=$V\"#g" site/index.html
          grep -E "\?v=$V" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
